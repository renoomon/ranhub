# نشر RANHUB على GitHub Pages.
# مستودع مستقل: ما فيه مشروع ثانٍ يقدر يغيّر إعداداته أو يكسر نشره.
name: Deploy RANHUB to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة، وما نلغي نشرة جارية
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement يفعّل Pages تلقائيًا أول مرة — بلا ما تلمس الإعدادات
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # الموقع ثابت بلا بناء: نرفع الجذر كما هو
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
